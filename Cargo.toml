[package]
name = "postier"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dioxus = { version = "0.7", features = ["desktop"] }
image = { version = "0.25", default-features = false, features = ["png"] }
outlook-pst = "1.2"
rfd = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rig = { version = "0.42", default-features = false, features = ["agent", "rustls"] }
rust-stemmers = "1.2"
rusqlite = { version = "0.37", features = ["bundled", "modern_sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
url = "2.5"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
dioxus-icons = { version = "0.1.0", default-features = false }
time = { version = "0.3.44", default-features = false }

[dev-dependencies]
dioxus-ssr = "0.7"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
