name: CI Tests

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to test (leave empty to test the selected branch/ref)"
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI (dx)
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli

      - name: Check RSX formatting (dx fmt)
        run: dx fmt --check

      - name: Validate Dioxus RSX (dx check)
        run: dx check

      - name: Run test suite (cargo test)
        run: cargo test --locked
