[package]
name = "pst-rag"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
iced = { version = "0.13", features = ["tokio"] }
outlook-pst = "1.2"
rfd = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rig = { version = "0.42", default-features = false, features = ["agent", "rustls"] }
rusqlite = { version = "0.37", features = ["bundled", "modern_sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
url = "2.5"
tokio = { version = "1", features = ["rt"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
